name: Release and Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build, Test, and Publish Container
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Tests Before Release
        run: |
          pytest -v

      - name: 5. Extract Version and Metadata
        id: meta
        run: |
          # Automatically strip leading 'v' to derive semantic version (e.g. v1.0.0 -> 1.0.0)
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION="${RAW_TAG#v}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_LOWER}/student-ml-api"

          echo "Derived Version: ${VERSION}"
          echo "Commit SHA: ${COMMIT_SHA}"
          echo "Image Base: ${IMAGE_BASE}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

      - name: 6. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Build Docker Image with OCI Labels
        run: |
          IMAGE_BASE="${{ steps.meta.outputs.image_base }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.commit_sha }}"
          BUILD_DATE="${{ steps.meta.outputs.build_date }}"

          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${SHA}" \
            --build-arg REPOSITORY="${{ github.repository }}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t "${IMAGE_BASE}:${VERSION}" \
            -t "${IMAGE_BASE}:latest" \
            -t "${IMAGE_BASE}:${SHA}" \
            .

      - name: 8. Push Versioned Images to Registry
        run: |
          IMAGE_BASE="${{ steps.meta.outputs.image_base }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.commit_sha }}"

          docker push "${IMAGE_BASE}:${VERSION}"
          docker push "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:${SHA}"
