name: Pull Request CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'

jobs:
  validate:
    name: Test and Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Unit Tests with Pytest
        run: |
          pytest -v

      - name: 5. Validate Docker Build
        run: |
          docker build -t student-ml-api:test .
          echo "Docker build check succeeded. Image is NOT pushed during CI."
